<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found — Huddle</title>
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: #FFFFFF;
    color: #1a1a1a;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }
  .wordmark {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #7C3AED 0%, #9b59f7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 2.5rem;
  }
  .code {
    font-size: clamp(3.5rem, 12vw, 6rem);
    font-weight: 800;
    letter-spacing: -0.05em;
    line-height: 1;
    color: #1a1a1a;
    margin: 0 0 1rem;
  }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 0.75rem; }
  p { color: #6b7280; font-weight: 300; font-size: 1rem; margin: 0 auto 2.25rem; max-width: 26rem; line-height: 1.6; }
  a.home {
    display: inline-block;
    padding: 0.875rem 1.75rem;
    border-radius: 0.75rem;
    background: #7C3AED;
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    text-decoration: none;
    box-shadow: 0 4px 16px rgba(124, 58, 237, 0.25);
    transition: transform 200ms ease, box-shadow 200ms ease;
  }
  a.home:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(124, 58, 237, 0.35); }
  @media (prefers-reduced-motion: reduce) { a.home { transition: none; } }
</style>
</head>
<body>
  <main>
    <div class="wordmark">Huddle</div>
    <p class="code">404</p>
    <h1>This page wandered off.</h1>
    <p>The page you're after doesn't exist — or it moved while no one was looking. Let's get you back to the group.</p>
    <a class="home" href="/">Back to Huddle &rarr;</a>
  </main>
</body>
</html>
